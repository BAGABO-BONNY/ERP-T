spring.application.name=ERP

# ============= Spring Boot Application =============
server.port=8080
# Context path intentionally left as root; controllers carry their own /api prefix
# server.servlet.context-path=/api

# ============= Seed Credentials (ADMIN & MANAGER) =============
# Change these before deploying to production
app.seed.admin.username=admin
app.seed.admin.email=admin@erp.local
app.seed.admin.password=Admin@2026!
app.seed.admin.firstName=System
app.seed.admin.lastName=Admin

app.seed.manager.username=manager
app.seed.manager.email=manager@erp.local
app.seed.manager.password=Manager@2026!
app.seed.manager.firstName=System
app.seed.manager.lastName=Manager

# ============= PostgreSQL Database Configuration =============
spring.datasource.url=jdbc:postgresql://localhost:5432/erp_db
spring.datasource.username=postgres
spring.datasource.password=bonus123.
spring.datasource.driver-class-name=org.postgresql.Driver

# ============= JPA/Hibernate Configuration =============
# Hibernate Dialect — not needed, auto-detected from the PostgreSQL driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate Auto DDL Update Strategy
# Options: validate, update, create, create-drop, none
spring.jpa.hibernate.ddl-auto=update

# Disable open-in-view (avoids lazy-loading during view rendering)
spring.jpa.open-in-view=false

# Show SQL Queries
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Hibernate Batch Processing
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ============= Spring Security Configuration =============
# Uncomment below for custom security settings
# spring.security.user.name=admin
# spring.security.user.password=admin

# ============= JWT Configuration =============
# JWT Secret Key (must be at least 256 bits / 32 characters for HS256)
# Change this to a strong secret in production
app.jwt.secret=MyVerySecureAndLongJWTSecretKeyForERP2026WithMinimum32CharactersLength
# JWT Expiration Time in milliseconds (24 hours = 86400000 ms)
app.jwt.expiration=86400000
# JWT Refresh Token Expiration (7 days = 604800000 ms)
app.jwt.refresh-expiration=604800000

# ============= Logging Configuration =============
logging.level.root=INFO
logging.level.com.jva.ERP=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============= OpenAPI/Swagger Configuration =============
# API docs JSON endpoint
springdoc.api-docs.path=/v3/api-docs
# Swagger UI is served at /swagger-ui/index.html (springdoc default — no redirect needed)
# Do NOT set springdoc.swagger-ui.path — the default avoids the redirect that triggers 403
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true

# ============= Spring MVC =============
# Forward /error through the DispatcherServlet so SecurityConfig's permitAll("/error") applies
spring.mvc.throw-exception-if-no-handler-found=false

# ============= Jackson Configuration (for JSON processing) =============
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC


# ============= Email / SMTP Configuration =============
# Sender: bmbmanzi@gmail.com (Gmail SMTP with App Password)
# To generate an App Password: Google Account → Security → 2-Step Verification → App Passwords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=bagabobonny544@gmail.com
# Replace the value below with your Gmail App Password (NOT your regular Gmail password)
spring.mail.password=bonus123.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Institution name shown in salary credit messages
app.mail.institution-name=ERP Payroll System
app.mail.sender-name=ERP Payroll
# Set to false to disable email sending without removing the config
app.mail.enabled=true
